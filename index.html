<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Profile Manager</title>
<script>
// 在 CSS 解析前应用主题，避免刷新时闪烁
(function(){
  var t = localStorage.getItem('hermes-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="global-loader" id="global-loader"></div>

<div class="topbar">
  <button class="btn ghost" id="sidebar-toggle" title="折叠/展开侧栏 (Ctrl+B)" style="padding:6px 8px">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M2 3h12v1H2zm0 4h12v1H2zm0 4h12v1H2z"/></svg>
  </button>
  <button class="btn ghost" id="theme-toggle" onclick="toggleTheme()" title="切换主题" style="padding:6px 8px;font-size:14px">☀️</button>
  <div class="logo"><span class="dot"></span>Hermes Profile Manager</div>
  <div class="status">
    <span class="badge" id="hermes-home" title="点击修改 HERMES_HOME" style="cursor:pointer">--</span>
    <span class="badge" id="poll-status">--</span>
    <span class="badge" id="backup-count" title="备份数量" style="display:none">📦 0</span>
  </div>
  <button class="btn" onclick="doBackup(this)" title="一键备份所有 profile 的 config.yaml + .env">📦 备份</button>
  <button class="btn" onclick="showRestoreModal()" title="从历史备份恢复">↩ 恢复</button>
  <button class="btn" onclick="showCleanupModal()" title="清理超期备份">🧹 清理</button>
  <button class="btn" onclick="showLogsModal()" title="查看操作日志（用于问题查询和恢复）">📋 日志</button>
  <button class="btn" onclick="reloadAll()" title="刷新所有数据 (Ctrl+R)">↻ 刷新</button>
</div>

<div class="main">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header"><span>Profiles</span></div>
    <div class="profile-list" id="profile-list"></div>
  </div>
  <div class="editor-area" id="editor-area">
    <div class="empty-state"><div class="big">(◠‿◠)</div><div class="desc">选择一个 Profile 开始编辑~</div></div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="/static/js/main.js"></script>
</body>
</html>
